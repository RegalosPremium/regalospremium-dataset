# Plantilla SIN secretos para Google Ads por impersonation keyless (modo vigente).
# Copiar fuera del repositorio, preferentemente a:
# ~/.config/regalospremium/google-ads.yaml (chmod 600)
# Desde 2026-09-09 Google Ads no requiere developer token (google-ads >= 32.0.0).
# El acceso depende del proyecto Cloud regalospremium-ads-api y sus permisos IAM/Google Ads.
# La organización bloquea crear JSON keys. No use client_secret ni refresh_token aquí.
auth_mode: impersonated_service_account
target_service_account: rp-google-ads-cli@regalospremium-ads-api.iam.gserviceaccount.com
source_user_token_path: /home/USER/.config/regalospremium/gcp-user-token.json
customer_id: "5921822090"
# Sólo si la service account accede por una cuenta Manager/MCC:
# login_customer_id: "INSERT_MANAGER_CUSTOMER_ID"
use_proto_plus: true
# Fallback heredado sólo si una JSON key ya existe y está permitida:
# auth_mode: service_account_json
# json_key_file_path: /home/USER/.config/regalospremium/service-account.json
